<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* IAP 审核 Screenshot：按 SkinDetailScreen（doc-08 §16 S15）真实布局/文案/配色
     1:1 渲染，1290×2796（3x）。Chrome headless 渲染后 PIL 裁到 2796（补视口偏差）。
     文案取 zh-CN/store.ts，配色取 theme/tokens.ts 暗色语义档。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1290px; height: 2796px; background: #091522; overflow: hidden; }
  .screen { position: relative; width: 1290px; height: 2796px;
            font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }

  /* 状态栏（iPhone 15 Pro Max 形态） */
  .status { position: absolute; top: 0; left: 0; right: 0; height: 162px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 24px 96px 0 120px; }
  .status .time { font-size: 51px; font-weight: 600; color: #F3EFE7; letter-spacing: 1px; }
  .status .icons { display: flex; align-items: center; gap: 22px; }

  /* App bar 56pt：返回 44×44 + 居中标题 */
  .appbar { position: absolute; top: 162px; left: 0; right: 0; height: 168px; }
  .back { position: absolute; left: 36px; top: 18px; width: 132px; height: 132px;
          border-radius: 66px; background: rgba(243,239,231,0.06);
          display: flex; align-items: center; justify-content: center; }
  .appbar .title { position: absolute; left: 264px; right: 264px; top: 0; height: 168px;
                   line-height: 168px; text-align: center;
                   font-size: 60px; font-weight: 600; color: #F3EFE7; }

  /* 媒体预览 390pt + 状态切换 chips */
  .preview { position: absolute; top: 330px; left: 0; width: 1290px; height: 1170px;
             background: #122338; overflow: hidden; }
  .preview img { width: 1290px; height: 1560px; object-fit: cover;
                 object-position: 50% 30%; margin-top: -120px; }
  .chips { position: absolute; top: 1536px; left: 48px; right: 48px;
           display: flex; gap: 24px; }
  .chip { flex: 1; height: 120px; border-radius: 36px;
          border: 3px solid rgba(243,239,231,0.12);
          display: flex; align-items: center; justify-content: center;
          font-size: 45px; font-weight: 500; color: #B4BECA; }
  .chip.on { border-color: #6EA6F2; background: rgba(79,143,232,0.16); color: #6EA6F2; }

  /* 信息卡 */
  .card { position: absolute; top: 1740px; left: 48px; right: 48px;
          border-radius: 48px; background: #0D1B2B;
          border: 2px solid rgba(243,239,231,0.08); padding: 54px; }
  .skin-name { font-size: 78px; font-weight: 600; color: #F3EFE7; }
  .creator { margin-top: 24px; display: flex; align-items: center; gap: 15px;
             font-size: 39px; font-weight: 500; color: #C9A45C; }
  .row { margin-top: 40px; display: flex; justify-content: space-between;
         align-items: flex-start; gap: 48px; }
  .row .k { font-size: 45px; color: #7E8A99; flex-shrink: 0; }
  .row .v { font-size: 45px; color: #F3EFE7; text-align: right; }
  .note { margin-top: 44px; padding-top: 40px;
          border-top: 2px solid rgba(243,239,231,0.08);
          font-size: 36px; color: #7E8A99; line-height: 1.4; }

  /* 底部主 CTA：¥6 永久解锁 */
  .cta-area { position: absolute; left: 48px; right: 48px; bottom: 90px; }
  .cta { height: 168px; border-radius: 48px; background: #4F8FE8;
         display: flex; align-items: center; justify-content: center; gap: 24px;
         font-size: 51px; font-weight: 600; color: #FFFFFF; }
</style>
</head>
<body>
  <div class="screen">
    <div class="status">
      <div class="time">9:41</div>
      <div class="icons">
        <svg width="82" height="46" viewBox="0 0 82 46"><g fill="#F3EFE7">
          <rect x="0" y="28" width="12" height="18" rx="4"/><rect x="22" y="20" width="12" height="26" rx="4"/>
          <rect x="44" y="10" width="12" height="36" rx="4"/><rect x="66" y="0" width="12" height="46" rx="4" opacity="0.35"/>
        </g></svg>
        <svg width="66" height="46" viewBox="0 0 66 46"><g fill="none" stroke="#F3EFE7" stroke-width="8" stroke-linecap="round">
          <path d="M6 18 A38 38 0 0 1 60 18"/><path d="M16 30 A24 24 0 0 1 50 30"/>
        </g><circle cx="33" cy="41" r="5" fill="#F3EFE7"/></svg>
        <svg width="98" height="48" viewBox="0 0 98 48">
          <rect x="2" y="4" width="82" height="40" rx="12" fill="none" stroke="#F3EFE7" stroke-width="5" opacity="0.5"/>
          <rect x="8" y="10" width="58" height="28" rx="7" fill="#F3EFE7"/>
          <path d="M88 17 v14 a10 10 0 0 0 0 -14" fill="#F3EFE7" opacity="0.5"/>
        </svg>
      </div>
    </div>

    <div class="appbar">
      <div class="back">
        <svg width="60" height="52" viewBox="0 0 60 52"><g fill="none" stroke="#F3EFE7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M26 6 L6 26 L26 46"/><path d="M8 26 H54"/>
        </g></svg>
      </div>
      <div class="title">陪伴皮肤</div>
    </div>

    <div class="preview">
      <img src="file:///Volumes/MacMiniDisk/workspace/LofiCompanion/loficompanion/react-native/assets/skins/midnight-workstation/ready.jpg">
    </div>
    <div class="chips">
      <div class="chip on">准备</div>
      <div class="chip">专注</div>
      <div class="chip">喝水</div>
      <div class="chip">完成</div>
    </div>

    <div class="card">
      <div class="skin-name">深夜工作台</div>
      <div class="creator">
        <svg width="42" height="42" viewBox="0 0 42 42"><path fill="#C9A45C" d="M3 10 L12 18 L21 6 L30 18 L39 10 L36 32 H6 Z"/></svg>
        官方出品
      </div>
      <div class="row"><div class="k">包含状态</div><div class="v">6 个状态</div></div>
      <div class="row"><div class="k">音轨</div><div class="v">环境白噪音（以上线资源为准）</div></div>
      <div class="row"><div class="k">离线大小</div><div class="v">离线包约 100 MB（估算，以上线包为准）</div></div>
      <div class="note">仅供个人学习陪伴使用，不可商用或二次分发</div>
    </div>

    <div class="cta-area">
      <div class="cta">¥6 永久解锁</div>
    </div>
  </div>
</body>
</html>
