name: React Native Publish

# 统一发布链路：tools/release.sh 打 tag v<version> → 本 workflow 经 EAS 构建
# 并自动提交 App Store Connect + Google Play（production profile，双平台）。
# 版本唯一真源是 loficompanion/react-native/package.json 的 version，签名凭证
# 全部托管在 EAS 服务端（iOS 证书/描述文件、Android keystore、ASC API Key、
# Play 服务账号），CI 只需要一个 EXPO_TOKEN。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台（all=双平台）"
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

concurrency:
  group: eas-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loficompanion/react-native
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 版本一致性校验（tag 必须等于 package.json 版本）
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致；版本唯一真源是 package.json，请用 tools/release.sh 发版"
            exit 1
          fi
          echo "版本一致性 OK: v$TAG_VERSION"

      # 原生版本位同步：仓库是 CNG（ios/ android/ 不入库），CI 上 managed prebuild
      # 直接取 package.json 版本，此步在 CI 会跳过原生文件；仅本地构建时有意义
      # （与 eas-build-post-install 同语义，构建期自愈）。
      - name: 同步原生版本文件
        run: node ./scripts/sync-version.mjs

      - name: EAS build + 双商店提交
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN 未配置：在 https://expo.dev/settings/access-tokens 创建 Access Token 后执行 gh secret set EXPO_TOKEN"
            exit 1
          fi
          PLATFORM="${{ inputs.platform || 'all' }}"
          npx --yes eas-cli@latest build \
            --profile production \
            --platform "$PLATFORM" \
            --auto-submit-with-profile=production \
            --non-interactive
