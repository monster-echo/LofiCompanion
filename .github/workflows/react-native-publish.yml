name: React Native Publish

# 统一发布链路：tools/release.sh 打 tag v<version> → 本 workflow 在 GitHub
# runner 上跑 eas build --local（不消耗 EAS 构建配额，公开仓库 Actions 免费）
# 并自动提交 App Store Connect + Google Play（production profile，双平台）。
#
# 版本唯一真源是 loficompanion/react-native/package.json 的 version，签名凭证
# 全部托管在 EAS 服务端（iOS 证书/描述文件、Android keystore、ASC API Key、
# Play 服务账号，经 EXPO_TOKEN 取用）。Firebase 真配置经 GitHub secrets
# GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_INFO_PLIST 注入（eas build --local
# 不评估 EAS 文件环境变量，且归档遵循 .gitignore，必须由 CI 显式落盘）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台（all=双平台）"
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

concurrency:
  group: eas-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    defaults:
      run:
        working-directory: loficompanion/react-native
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: loficompanion/react-native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 版本一致性校验（tag push 强制；手动 dispatch 视为测试跑，跳过）
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "workflow_dispatch 测试跑：跳过 tag↔version 校验"
            exit 0
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致；版本唯一真源是 package.json，请用 tools/release.sh 发版"
            exit 1
          fi
          echo "版本一致性 OK: v$TAG_VERSION"

      - name: 写入 Firebase 配置（eas --local 不评估 EAS 文件环境变量）
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          # EAS 归档遵循 .gitignore——临时解除忽略，否则配置进不了构建包
          sed -i 's|^loficompanion/react-native/google-services.json|# unignored for eas local archive|' $GITHUB_WORKSPACE/.gitignore
          sed -i 's|^\*\*/google-services.json|# unignored for eas local archive|' $GITHUB_WORKSPACE/loficompanion/.gitignore
          git check-ignore google-services.json && exit 1 || echo "配置已解除忽略"

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('loficompanion/react-native/package-lock.json') }}

      - name: EAS 本地构建 AAB（不消耗 EAS 配额）
        run: npx --yes eas-cli@latest build --profile production --platform android --local --non-interactive --output app.aab

      - name: 提交 Google Play
        run: npx --yes eas-cli@latest submit --platform android --path app.aab --profile production --non-interactive

  publish-ios:
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    defaults:
      run:
        working-directory: loficompanion/react-native
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: loficompanion/react-native/package-lock.json

      - name: 安装依赖
        run: npm ci --legacy-peer-deps

      - name: 版本一致性校验（tag push 强制；手动 dispatch 视为测试跑，跳过）
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "workflow_dispatch 测试跑：跳过 tag↔version 校验"
            exit 0
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json 版本 $PKG_VERSION 不一致；版本唯一真源是 package.json，请用 tools/release.sh 发版"
            exit 1
          fi
          echo "版本一致性 OK: v$TAG_VERSION"

      - name: 写入 Firebase 配置（iOS 无占位，缺真配置让 prebuild 报错）
        env:
          GOOGLE_SERVICES_INFO_PLIST: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_INFO_PLIST" > GoogleService-Info.plist
          sed -i '' 's|^loficompanion/react-native/GoogleService-Info.plist|# unignored for eas local archive|' $GITHUB_WORKSPACE/.gitignore
          sed -i '' 's|^\*\*/GoogleService-Info.plist|# unignored for eas local archive|' $GITHUB_WORKSPACE/loficompanion/.gitignore
          git check-ignore GoogleService-Info.plist && exit 1 || echo "配置已解除忽略"

      - name: EAS 本地构建 IPA（不消耗 EAS 配额）
        run: npx --yes eas-cli@latest build --profile production --platform ios --local --non-interactive --output app.ipa

      - name: 提交 App Store Connect
        run: npx --yes eas-cli@latest submit --platform ios --path app.ipa --profile production --non-interactive
