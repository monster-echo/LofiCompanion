name: Server CI

on:
  push:
    branches: [main]
    paths:
      - "loficompanion/server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "loficompanion/server/**"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zhongbei_auth_test
          POSTGRES_USER: zhongbei_auth
          POSTGRES_PASSWORD: zhongbei_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhongbei_auth -d zhongbei_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_DATABASE_URL: postgresql://zhongbei_auth:zhongbei_auth_test@localhost:5432/zhongbei_auth_test
    defaults:
      run:
        working-directory: loficompanion/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
