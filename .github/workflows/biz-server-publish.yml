name: Biz Server Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "loficompanion/biz-server/**"
      - ".github/workflows/biz-server-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: biz-server-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: loficompanion/biz-server
          file: loficompanion/biz-server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          target: runner
          tags: |
            ghcr.io/${{ github.repository_owner }}/lofi-biz:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag arch image (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/lofi-biz:latest-${{ matrix.arch }} \
            ghcr.io/${{ github.repository_owner }}/lofi-biz:${{ github.sha }}-${{ matrix.arch }}

  manifest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/lofi-biz:latest \
            ghcr.io/${{ github.repository_owner }}/lofi-biz:latest-amd64 \
            ghcr.io/${{ github.repository_owner }}/lofi-biz:latest-arm64
