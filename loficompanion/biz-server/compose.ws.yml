# 自习室 WebSocket 服务（VPS 单容器）。REST 主服务仍按 README 推荐
# 跑 Vercel；这里只承载长连接。数据库指向现有业务 Postgres（.env 提供）。
#
#   docker compose -f compose.ws.yml up -d --build
#
# 前置：.env 里配置 DATABASE_URL / AUTH_BASE_URL / APP_ID /
# INTERNAL_CLIENT_ID / INTERNAL_CLIENT_SECRET；
# wss:// 终止交给反代（如 wss://lofi-biz.zhongbei.tech/studyroom → 127.0.0.1:3321）。
services:
  studyroom-ws:
    build:
      context: .
      target: wsrunner
    restart: unless-stopped
    ports:
      - "3321:3321"
    env_file:
      - .env
    environment:
      STUDYROOM_WS_PORT: "3321"
