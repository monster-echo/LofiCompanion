# 皮肤唯一配置源（雨夜书房）。
# 修改后运行 `npm run skins:generate` 重新生成
# src/features/skins/domain/rainyStudyRoom.generated.ts（CI 用 --check 校验同步）。
# 海报为 1290×2796 全屏图，放在本 YAML 同目录。

id: rainy-study-room-v1
slug: rainy-study-room
name: 雨夜书房
accessType: free
manifestVersion: 1
defaultState: ready

# doc-01 §5.2：rain.500 / night.850
themeTokens:
  accent: '#4F8FE8'
  surface: '#0D1B2B'

# 动画参数：crossfadeMs=状态切换交叉淡化（全屏静态海报构图差异大，500ms 才
# 不读作硬切；视频循环间衔接仍按 doc-07 §9.2 用 150ms）；focalZoom=取景放大倍率（1=不裁切）
animation:
  crossfadeMs: 500
  focalZoom: 1.0

# 健康事件自动排程：专注进行中按区间随机触发喝水事件（分钟）
wellness:
  autoDrink:
    enabled: true
    minIntervalMinutes: 18
    maxIntervalMinutes: 30

# 六种陪伴状态的海报与取景（poster 相对本目录；focal 归一化 0..1）。
# video 相对本目录（MiniMax H3 图生视频，无音轨竖版，循环态首尾帧锁定）：
#   videoLoop=true  背景循环（ready/focusing/paused/resting）——硬切无缝循环，
#                   播放器原生循环即可，无需叠化衔接；
#   videoLoop=false 单次动作（drinking/completed）——播完定格，由控制器按
#                   returnState 回归基态。
states:
  - state: ready
    poster: ready.png
    video: videos/ready.mp4
    videoLoop: true
  - state: focusing
    poster: focusing.png
    video: videos/focusing.mp4
    videoLoop: true
  - state: paused
    poster: paused.png
    video: videos/paused.mp4
    videoLoop: true
  - state: drinking
    poster: drinking.png
    video: videos/drinking.mp4
    videoLoop: false
  - state: resting
    poster: resting.png
    video: videos/resting.mp4
    videoLoop: true
  - state: completed
    poster: completed.png
    video: videos/completed.mp4
    videoLoop: false
# 全局缺省取景/时长（单状态可用 focal/durationMs 覆盖）
defaults:
  focal: { x: 0.5, y: 0.38 }
  durationMs: 4000

# doc-01 §5.4 P0 事件表：优先级 / 是否可打断逐项一致；
# cooldownSeconds 仅健康类非零；returnState 为动作播完后的回归状态
events:
  - { eventType: session.ready, priority: 60, interruptible: true, returnState: ready }
  - { eventType: focus.started, priority: 80, interruptible: false, returnState: focusing }
  - { eventType: focus.loop, priority: 10, interruptible: true, returnState: focusing }
  - { eventType: wellness.drink, priority: 70, interruptible: false, returnState: focusing, cooldownSeconds: 60 }
  - { eventType: focus.paused, priority: 90, interruptible: true, returnState: paused }
  - { eventType: break.started, priority: 80, interruptible: false, returnState: resting }
  - { eventType: focus.resumed, priority: 90, interruptible: false, returnState: focusing }
  - { eventType: focus.completed, priority: 100, interruptible: false, returnState: ready }
