services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhongbei_auth
      POSTGRES_USER: zhongbei_auth
      POSTGRES_PASSWORD: ${ZHONGBEI_AUTH_POSTGRES_PASSWORD:-change-me}
    volumes:
      - loficompanion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhongbei_auth -d zhongbei_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/rwecho/loficompanion:latest
    restart: unless-stopped
    ports:
      - "3210:3210"
    env_file:
      - .env.local
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: zhongbei_auth
      PGUSER: zhongbei_auth
      PGPASSWORD: ${ZHONGBEI_AUTH_POSTGRES_PASSWORD:-change-me}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  loficompanion-postgres:
