services:
  server:
    image: ghcr.io/rwecho/loficompanion:${ZHONGBEI_AUTH_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: loficompanion
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3210:3210"
    networks:
      - global_network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3210/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  global_network:
    external: true
